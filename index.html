<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/shanj-demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="思必驰闪记">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="思必驰闪记">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=20261031"/>

  <title>思必驰闪记</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #fff; }
    #web-loading { position: fixed; inset: 0; display: grid; place-items: center; color: #282d35; font: 600 24px/1.5 system-ui, sans-serif; }
    #web-loading[hidden] { display: none; }
    #web-loading span { display: block; margin-top: 12px; color: #69717d; font: 400 14px/1.5 system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
  <div id="web-loading" role="status" aria-live="polite">思必驰闪记<span id="web-loading-status">正在加载</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('web-loading').hidden = true;
    }, { once: true });
    window.addEventListener('ai-note-startup-error', function () {
      document.getElementById('web-loading-status').textContent = '加载失败，请刷新重试';
    });
  </script>
  <script>
    window.realtimeSubtitleOpen = async function (...args) {
      try {
        await import('./realtime_subtitle_window.js');
        return await window.realtimeSubtitleOpen(...args);
      } catch (error) {
        console.error('Subtitle window failed to load', error);
        return false;
      }
    };
    window.realtimeSubtitleUpdate = function () { return false; };
    window.realtimeSubtitleClose = function () {};
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
