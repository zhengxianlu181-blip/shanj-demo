<div class="app">

function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(glyphs[name]||'')+'"/></svg>'}
document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML='<span class="icon">'+icon(e.dataset.icon)+'</span>');
function createWordBlob(lines) {
  const encoder = new TextEncoder();
  const xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const escapeXml = (value) => String(value ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g, '').replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
  const wns = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const paragraphs = lines.map((line, index) => {
    const text = escapeXml(line).split(/\r\n|\r|\n|\t/);
    const breaks = String(line ?? '').match(/\r\n|\r|\n|\t/g) || [];
    const runs = text.map((part, i) => (i ? (breaks[i - 1] === '\t' ? '<w:tab/>' : '<w:br/>') : '') + `<w:t xml:space="preserve">${part}</w:t>`).join('');
    const prop = index === 0 ? '<w:b/><w:sz w:val="36"/><w:szCs w:val="36"/>' : '<w:sz w:val="22"/><w:szCs w:val="22"/>';
    return `<w:p><w:pPr><w:spacing w:after="${index === 0 ? '220' : '100'}"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Microsoft YaHei" w:hAnsi="Microsoft YaHei" w:eastAsia="Microsoft YaHei"/>${prop}<w:lang w:val="zh-CN" w:eastAsia="zh-CN"/></w:rPr>${runs}</w:r></w:p>`;
  }).join('');
  const files = [
    ['[Content_Types].xml', xml + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
    ['_rels/.rels', xml + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
    ['word/document.xml', xml + `<w:document xmlns:w="${wns}"><w:body>${paragraphs}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1361" w:right="1361" w:bottom="1361" w:left="1361" w:header="680" w:footer="680" w:gutter="0"/></w:sectPr></w:body></w:document>`],
  ];
  const table = Uint32Array.from({ length: 256 }, (_, byte) => {
    let crc = byte;
    for (let i = 0; i < 8; i++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
    return crc;
  });
  const chunks = [], central = [];
  let offset = 0, centralSize = 0;
  for (const [path, contents] of files) {
    const name = encoder.encode(path), body = encoder.encode(contents);
    let crc = 0xffffffff;
    for (const byte of body) crc = (crc >>> 8) ^ table[(crc ^ byte) & 0xff];
    crc = (crc ^ 0xffffffff) >>> 0;
    const local = new Uint8Array(30 + name.length), l = new DataView(local.buffer);
    l.setUint32(0, 0x04034b50, true);
    l.setUint16(4, 20, true); l.setUint16(6, 0x0800, true); l.setUint16(12, 33, true);
    l.setUint32(14, crc, true); l.setUint32(18, body.length, true); l.setUint32(22, body.length, true);
    l.setUint16(26, name.length, true); local.set(name, 30);
    const record = new Uint8Array(46 + name.length), c = new DataView(record.buffer);
    c.setUint32(0, 0x02014b50, true);
    c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 33, true);
    c.setUint32(16, crc, true); c.setUint32(20, body.length, true); c.setUint32(24, body.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true); record.set(name, 46);
    chunks.push(local, body); central.push(record);
    offset += local.length + body.length; centralSize += record.length;
  }
  const end = new Uint8Array(22), e = new DataView(end.buffer);
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, centralSize, true); e.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

function seek(t,openRaw=false){
  if(!canReadNote(find()))return;
  position=Math.min(24,Math.max(0,t));sourceAt=find().lines.filter(l=>l[0]<=position).at(-1)?.[0]??0;
  lastFollowAt=-1;
  if(openRaw){tab='raw';render();$('#line-'+sourceAt)?.scrollIntoView({block:'nearest'});$('#line-'+sourceAt+' button')?.focus({preventScroll:true});}
  paintPlayer(); if(playback){lastLine=-1;readVoice()}
}
function zhVoice(){return window.speechSynthesis?.getVoices().find(v=>v.localService&&/^zh[-_]/i.test(v.lang)&&!/(HK|TW)$/i.test(v.lang))}
function readVoice(){
  const note=find();if(page==='detail'&&!canReadNote(note))return;
  const current=note.lines.filter(l=>l[0]<=position).at(-1);

function play(){

  if(page==='detail'&&!canReadNote(find())){toast('这条笔记已在演示保险箱中，请先解锁');return}
  if(playback){stopPlay();return}
  if(position>=24)position=0;
  if(!zhVoice())toast('此浏览器未提供本机中文语音，将演示文字与进度联动');
  readVoice();
  playback=setInterval(()=>{position=Math.min(24,position+.25*rate);sourceAt=find().lines.filter(l=>l[0]<=position).at(-1)?.[0]??0;paintPlayer();if(position>=24)stopPlay();else readVoice()},250);

function buildTemplateRows(n,p){
  const result=[], line=(at)=>n.lines.find(x=>x[0]===at)||n.lines[0], concise=/简洁|精简|简短/.test(p.requirement);

function safeRichHTML(html){
  const box=document.createElement('div');box.innerHTML=String(html||'');
  const allowed=new Set(['P','DIV','BR','H1','H2','H3','H4','B','STRONG','I','EM','U','UL','OL','LI','BLOCKQUOTE','TABLE','THEAD','TBODY','TR','TD','TH','SECTION']);
  [...box.querySelectorAll('*')].reverse().forEach(el=>{
    if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','IMG','SVG','LINK','META'].includes(el.tagName)){el.remove();return}
    if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);return}
    [...el.attributes].forEach(a=>{if(!(['colspan','rowspan'].includes(a.name)&&/^\d{1,2}$/.test(a.value)))el.removeAttribute(a.name)});
  });return box.innerHTML;
}
function richTextFromHTML(html){const el=document.createElement('div');el.innerHTML=safeRichHTML(String(html||'').replace(/<\/(p|h[1-6]|li|div|tr|section)>/gi,'\n'));return el.textContent.trim()}

function documentView(){
  const n=find();if(!canReadNote(n))return privacyLockedView();
  return '<div class="document-head"><div>'+btn('返回笔记','document-back','arrow-left','btn-quiet')+'<h1>富文本模式</h1><p>'+esc(n.title)+' · 可编辑笔记 · 本地保存 · 演示模式</p></div><div class="detail-actions">'+btn('手写工作区','canvas-open','edit-3','btn-light','data-id="'+esc(n.id)+'"')+btn('下载 TXT','document-txt','download')+btn('下载 DOCX','document-docx','download')+btn('保存','rich-save','check','btn-primary')+'</div></div><section class="card rich-workspace"><div class="rich-mode-bar" role="tablist" aria-label="笔记编辑模式"><strong>编辑模式</strong><button type="button" class="btn btn-light" data-act="rich-to-minutes">会议纪要</button><button type="button" class="btn active" aria-selected="true">富文本</button><button type="button" class="btn btn-light" data-act="canvas-open" data-id="'+esc(n.id)+'">手写画布</button></div><div class="rich-toolbar" role="toolbar" aria-label="富文本编辑工具"><select id="richBlock" aria-label="段落样式"><option value="p">正文</option><option value="h1">一级标题</option><option value="h2">二级标题</option><option value="h3">三级标题</option></select>'+[['bold','加粗'],['italic','斜体'],['underline','下划线'],['insertUnorderedList','无序列表'],['insertOrderedList','有序列表'],['undo','撤销'],['redo','重做']].map(([k,l])=>btn(l,'rich-format','','btn-light','data-command="'+k+'"')).join('')+btn('插入表格','rich-table','plus')+btn('复制中文内容','rich-copy','copy')+'<span id="richSaveStatus" class="small-note" role="status">富文本内容保存在本机</span></div><label class="rich-title-label">笔记名称<input id="richNoteTitle" value="'+esc(n.title)+'" maxlength="80"></label><div class="rich-paper-wrap"><div id="richEditor" class="rich-paper" contenteditable="true" role="textbox" aria-label="笔记文档正文" aria-multiline="true" data-placeholder="在这里开始输入，支持标题、列表、表格、加粗与手写摘录。">'+safeRichHTML(n.richDoc||'')+'</div></div><p class="rich-foot">可用键盘编辑、选择和复制；富文本内容与原始手写图层都会保留。导出保留可编辑文字，不同步真实设备。</p></section>';
}
function saveRichDocument(showToast=true){
  const n=find();if(!privacyGuardNote(n))return false;const ed=$('#richEditor');if(!ed)return false;
  n.richDoc=safeRichHTML(ed.innerHTML);n.title=$('#richNoteTitle')?.value.trim()||'未命名笔记';persist();const status=$('#richSaveStatus');if(status)status.textContent='已保存到本机';if(showToast)toast('富文本内容已保存');return true;
}
function richCommand(command,value){const ed=$('#richEditor');if(!ed||!canReadNote(find()))return;ed.focus();document.execCommand(command,false,value);saveRichDocument(false)}
function newRichDocument(){
  const n=makeNote('d'+Date.now(),'闪记','未命名笔记');n.kind='document';n.lines=[];n.summaries=[];n.tasks=[];n.marks=[];n.richDoc='';notes.unshift(n);
  if(prefs.privacy.offline){prefs.privacy.vaultIds.push(n.id);vaultSessionUnlocked=true}persist();openRichDocument(n.id);toast('已新建富文本笔记，来源标记为闪记');
}
function handleDocumentAction(act,b){
  if(act==='new-note'){newRichDocument();return true}
  if(!['document-back','rich-save','rich-format','rich-table','rich-copy','document-txt','document-docx','rich-to-minutes'].includes(act))return false;
  if(!privacyGuardNote(find()))return true;
  if(act==='rich-to-minutes'){saveRichDocument(false);detail(noteId,'minutes');return true}
  if(act==='document-back'){saveRichDocument(false);find().kind==='document'?navigate('home'):detail(noteId,'notes');return true}
  if(act==='rich-save'){saveRichDocument();return true}
  if(act==='rich-format'){richCommand(b.dataset.command);return true}
  if(act==='rich-table'){richCommand('insertHTML','<table><tbody><tr><th>事项</th><th>负责人</th><th>时间</th></tr><tr><td>填写事项</td><td>待指定</td><td>待补充</td></tr></tbody></table><p><br></p>');return true}
  if(act==='rich-copy'){saveRichDocument(false);void navigator.clipboard.writeText(documentPlain(noteId)).then(()=>toast('已复制富文本内容')).catch(()=>toast('暂时无法自动复制，请手动选中文档内容'));return true}
  if(act==='document-txt'||act==='document-docx'){
    saveRichDocument(false);const body=documentPlain(noteId);if(!body){toast('请先填写文档内容再导出');return true}
    const ls=[find().title,'本地演示文档','',...body.split('\n')],word=act==='document-docx';saveLocalBlob(word?createWordBlob(ls):new Blob(['\ufeff',ls.join('\r\n')],{type:'text/plain;charset=utf-8'}),find().title.replace(/[\\/:*?"<>|]/g,'_')+'_中文文档.'+(word?'docx':'txt'));toast('已生成中文'+(word?' DOCX':' TXT')+'文件');return true;
  }return false;
}
document.addEventListener('mousedown',e=>{if(e.target.closest?.('[data-act="rich-format"],[data-act="rich-table"]'))e.preventDefault()});
document.addEventListener('change',e=>{if(e.target.id==='richBlock')richCommand('formatBlock',e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='richEditor'||e.target.id==='richNoteTitle')saveRichDocument(false)});
document.addEventListener('paste',e=>{if(e.target.closest?.('#richEditor')){e.preventDefault();richCommand('insertText',e.clipboardData.getData('text/plain'))}});
document.addEventListener('keydown',e=>{if(page==='document'&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveRichDocument()}});

restoreProcess();
render();


</script>
</body>
</html>
