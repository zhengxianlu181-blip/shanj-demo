# Project Configuration
# Environment: dev (测试环境), beta (Beta环境), gray (灰度环境), prod (生产环境)
environment=beta

# Region: domestic (国内版), international (国际版)
region=domestic

# Country: legacy compatibility, cn maps to domestic, us maps to international
country=cn

# Build Configuration
buildNumber=5

# Version Information
# versionName: Base version (e.g., 1.0.1)
# versionCode: Build number (e.g., 26031301)
# Final version name will be: versionName.versionCode (e.g., 1.0.1.26031301)
# marketingVersion: User-visible version (e.g., 1.0.1) for iOS MARKETING_VERSION
versionName=3.3.0
versionCode=26110602
# Application ID
applicationId=com.aispeech.ai.app
